<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="3.625in" height="2.375in" viewBox="0 0 1087.5 712.5">
  <title>Warren County ARES ID Badge Template</title>
  <desc>Editable horizontal CR80 badge template with 0.125 inch bleed, photo placeholder, name/callsign fields, and top-center punch guide.</desc>

  <defs>
    <clipPath id="cardClip">
      <rect x="37.5" y="37.5" width="1012.5" height="637.5" rx="36" ry="36"/>
    </clipPath>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef3f8"/>
    </linearGradient>
  </defs>

  <!-- ===== BLEED / BACKGROUND LAYER ===== -->
  <g inkscape:groupmode="layer" inkscape:label="01 Background" id="layer-bg">
    <rect x="0" y="0" width="1087.5" height="712.5" fill="#ffffff"/>
    <rect x="0" y="0" width="1087.5" height="712.5" fill="url(#bgGrad)"/>

    <!-- Navy lower band -->
    <path d="M0,575 C260,640 540,560 760,585 C905,602 1000,630 1087.5,620 L1087.5,712.5 L0,712.5 Z"
          fill="#0b2b52"/>
    <!-- Red accent stripe -->
    <path d="M0,555 C250,615 525,540 755,565 C905,580 998,605 1087.5,595"
          fill="none" stroke="#c21f30" stroke-width="10"/>
    <path d="M0,567 C250,625 530,553 755,577 C905,592 998,618 1087.5,608"
          fill="none" stroke="#ffffff" stroke-width="5"/>

    <!-- Subtle radio tower watermark -->
    <g opacity="0.10" transform="translate(655,250)">
      <line x1="0" y1="250" x2="55" y2="0" stroke="#0b2b52" stroke-width="12"/>
      <line x1="110" y1="250" x2="55" y2="0" stroke="#0b2b52" stroke-width="12"/>
      <line x1="15" y1="190" x2="95" y2="190" stroke="#0b2b52" stroke-width="8"/>
      <line x1="25" y1="140" x2="85" y2="140" stroke="#0b2b52" stroke-width="8"/>
      <line x1="35" y1="90" x2="75" y2="90" stroke="#0b2b52" stroke-width="8"/>
      <circle cx="55" cy="0" r="14" fill="#0b2b52"/>
      <circle cx="55" cy="0" r="36" fill="none" stroke="#0b2b52" stroke-width="5"/>
      <circle cx="55" cy="0" r="66" fill="none" stroke="#0b2b52" stroke-width="5"/>
      <circle cx="55" cy="0" r="96" fill="none" stroke="#0b2b52" stroke-width="5"/>
    </g>
  </g>

  <!-- ===== HEADER / BRANDING ===== -->
  <g inkscape:groupmode="layer" inkscape:label="02 Header" id="layer-header">
    <text x="420" y="145" font-family="DejaVu Sans, Arial, sans-serif" font-size="78" font-weight="700" fill="#0b2b52">Warren County ARES</text>
    <line x1="420" y1="175" x2="1010" y2="175" stroke="#c21f30" stroke-width="9"/>
    <text x="420" y="225" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="600" fill="#0b2b52">Amateur Radio Emergency Service</text>
  </g>

  <!-- ===== PHOTO PLACEHOLDER ===== -->
  <g inkscape:groupmode="layer" inkscape:label="03 Photo" id="layer-photo">
    <rect x="88" y="135" width="285" height="330" rx="14" ry="14" fill="#e7eaee" stroke="#0b2b52" stroke-width="8"/>

    <!-- Generic silhouette -->
    <circle cx="230.5" cy="245" r="72" fill="#9aa3ad"/>
    <path d="M118,442 C128,344 171,305 230.5,305 C290,305 333,344 343,442 Z" fill="#9aa3ad"/>

    <text x="230.5" y="490" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#5d6570">REPLACE WITH PHOTO</text>
  </g>

  <!-- ===== MEMBER TEXT ===== -->
  <g inkscape:groupmode="layer" inkscape:label="04 Member Text" id="layer-member-text">
    <text x="88" y="555" font-family="DejaVu Sans, Arial, sans-serif" font-size="66" font-weight="700" fill="#0b2b52">John Doe</text>
    <text x="88" y="610" font-family="DejaVu Sans, Arial, sans-serif" font-size="42" font-weight="600" fill="#0b2b52">N0CALL</text>

    <!-- Role badge -->
    <rect x="760" y="505" width="250" height="62" rx="14" ry="14" fill="#0b2b52"/>
    <text x="885" y="548" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">MEMBER</text>

    <!-- Editable local group line -->
    <text x="760" y="600" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#ffffff">COMMUNICATION • SERVICE • COMMUNITY</text>
  </g>

  <!-- ===== LOGO PLACEHOLDERS ===== -->
  <g inkscape:groupmode="layer" inkscape:label="05 Logos" id="layer-logos">
    <circle cx="885" cy="365" r="105" fill="#ffffff" stroke="#c21f30" stroke-width="10"/>
    <circle cx="885" cy="365" r="87" fill="none" stroke="#0b2b52" stroke-width="5"/>
    <text x="885" y="345" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" fill="#0b2b52">ARES / ARRL</text>
    <text x="885" y="380" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#0b2b52">LOGO</text>
    <text x="885" y="410" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#5d6570">PLACEHOLDER</text>
  </g>

  <!-- ===== PUNCH GUIDE ===== -->
  <g inkscape:groupmode="layer" inkscape:label="06 Punch Guide" id="layer-punch">
    <!-- Centered over trim area: trim center x = 543.75 -->
    <circle cx="543.75" cy="76" r="33" fill="none" stroke="#666666" stroke-width="3" stroke-dasharray="10,8"/>
    <circle cx="543.75" cy="76" r="18" fill="#ffffff" stroke="#777777" stroke-width="2"/>
    <text x="585" y="83" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#666666">HOLE / SLOT AREA</text>
  </g>

  <!-- ===== GUIDES (hide before export if printer does not want them) ===== -->
  <g inkscape:groupmode="layer" inkscape:label="99 Guides - Hide Before Export" id="layer-guides">
    <!-- Trim: 3.375 x 2.125 inches -->
    <rect x="37.5" y="37.5" width="1012.5" height="637.5" rx="36" ry="36"
          fill="none" stroke="#ff00ff" stroke-width="2" stroke-dasharray="14,9"/>
    <!-- Safe zone: 0.125 inch inside trim -->
    <rect x="75" y="75" width="937.5" height="562.5" rx="24" ry="24"
          fill="none" stroke="#00a0a0" stroke-width="2" stroke-dasharray="10,8"/>
    <text x="48" y="28" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#8a008a">MAGENTA = TRIM   |   TEAL = SAFE ZONE   |   PAGE INCLUDES 0.125 in BLEED</text>
  </g>
</svg>
